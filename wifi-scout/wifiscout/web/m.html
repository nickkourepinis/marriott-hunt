<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a78d6">
<title>WiFi Scout Survey</title>
<style>
/*INLINE:app.css*/
html, body { height: 100%; }
body { display: flex; flex-direction: column; overscroll-behavior-y: none; }
.top {
  position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--hairline);
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) 8px max(var(--gutter), env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px;
}
.top h1 { font-size: 17px; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top select { max-width: 46vw; }
main {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 12px max(var(--gutter), env(safe-area-inset-right, 0px)) 24px max(var(--gutter), env(safe-area-inset-left, 0px));
}
.view { display: flex; flex-direction: column; gap: 12px; max-width: 720px; margin: 0 auto; }
.map-wrap canvas { height: min(40vh, 100vw); min-height: 220px; }
.chips.one-line { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.chips.one-line .chip { flex: 0 0 auto; }
.map-hint { position: absolute; left: 10px; top: 8px; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px; padding: 2px 8px; }
.tabs {
  display: flex; background: var(--surface); border-top: 1px solid var(--hairline);
  padding: 0 0 env(safe-area-inset-bottom, 0px);
}
.tabs button {
  flex: 1 1 0; border: 0; background: none; padding: 10px 4px 9px; font-size: 12.5px; font-weight: 600; color: var(--ink-3);
  border-top: 2px solid transparent; cursor: pointer; touch-action: manipulation;
}
.tabs button[aria-selected="true"] { color: var(--accent-ink); border-top-color: var(--accent); }
.progress { font-size: 14px; color: var(--ink-2); min-height: 22px; }
.reading { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.reading div { background: var(--plane); border-radius: 8px; padding: 8px 6px; text-align: center; min-width: 0; }
.reading b { display: block; font-size: 17px; font-weight: 650; white-space: nowrap; }
.reading span { font-size: 11.5px; color: var(--ink-3); }
.spot-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); cursor: pointer; }
.spot-row:last-child { border-bottom: 0; }
.spot-row .vals { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); }
.spot-row[aria-current="true"] { background: var(--accent-wash); margin: 0 -8px; padding: 10px 8px; border-radius: 8px; border-bottom-color: transparent; }
.finding { border-top: 1px solid var(--hairline); padding: 12px 0; }
.finding:first-child { border-top: 0; padding-top: 0; }
.finding ul, .fix ol, .fix ul { margin: 6px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; }
.fix { border: 1px solid var(--hairline); border-radius: 10px; padding: 12px 14px; background: var(--raised); }
.fix summary { font-weight: 650; }
.score { font-size: 52px; font-weight: 650; line-height: 1; letter-spacing: -0.02em; }
.toast {
  position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 9;
  background: var(--ink); color: var(--surface); border-radius: 10px; padding: 10px 14px; font-size: 14px; max-width: 88vw; box-shadow: var(--shadow);
}
.steps-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
code { font-family: var(--mono); font-size: 12.5px; background: var(--plane); border-radius: 5px; padding: 2px 5px; word-break: break-all; }
.banner { border-radius: 10px; padding: 10px 12px; font-size: 14px; background: var(--warning-wash); border: 1px solid var(--hairline); }
</style>
</head>
<body>
<header class="top">
  <h1>WiFi Scout</h1>
  <select id="floor" class="input" aria-label="Floor"></select>
</header>
<main id="main"><div class="view"><p class="muted">Loading…</p></div></main>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="survey" aria-selected="true">Survey</button>
  <button role="tab" data-tab="results" aria-selected="false">Results</button>
  <button role="tab" data-tab="setup" aria-selected="false">Setup</button>
</nav>
<script>
/*INLINE:common.js*/
</script>
<script>
/*INLINE:m.js*/
</script>
</body>
</html>
